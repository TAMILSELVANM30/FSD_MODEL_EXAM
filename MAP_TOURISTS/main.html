<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tourist Guide - India</title>
  <link rel="stylesheet" href="assets/leaflet/leaflet.css">
</head>
<body>
  <h2>Tourist Guide - India Map</h2>
  <div id="map" style="height: 500px;"></div>

  <script src="assets/leaflet/leaflet.js"></script>
  <script>
    var map = L.map('map').setView([22, 79], 4);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: 'OpenStreetMap contributors'
    }).addTo(map);

    L.marker([13.08, 80.27]).addTo(map).bindPopup('<a href="chennai.html">Chennai</a>');
    L.marker([19.07, 72.87]).addTo(map).bindPopup('<a href="mumbai.html">Mumbai</a>');
    L.marker([28.61, 77.20]).addTo(map).bindPopup('<a href="delhi.html">Delhi</a>');
  </script>
</body>
</html>
